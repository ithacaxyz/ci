name: Auto Assign PR to Author

on:
  workflow_call:
    inputs:
      SKIP_IF_ASSIGNED:
        description: 'Skip assignment if PR already has assignees'
        required: false
        default: true
        type: boolean

env:
  SKIP_IF_ASSIGNED: ${{ inputs.SKIP_IF_ASSIGNED || true }}

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Auto assign PR to author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const author = pr.user.login
            const skipIfAssigned = process.env.SKIP_IF_ASSIGNED === Boolean(true)
            
            // Check if PR already has assignees
            if (skipIfAssigned && pr.assignees && pr.assignees.length > 0) {
              console.info(`PR #${pr.number} already has assignees. Skipping assignment.`)
              return
            }
            
            // Assign the PR to the author
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [author]
            })
            
            console.info(`Successfully assigned PR #${pr.number} to ${author}`)
